<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PAXI Games</title>
  <style>
    :root{
      --bg:#0f1222; --bg2:#171b32; --text:#e8ebfa; --text-muted:#8b93bd;
      --primary:#7c9bff; --success:#4ade80; --warning:#fbbf24; --danger:#f87171;
      --card:#181c36; --border:#2c3260;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:radial-gradient(1200px 600px at 50% -100px,#1c2244,var(--bg));
      color:var(--text);font-family:system-ui,"Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh;
      padding-bottom:env(safe-area-inset-bottom)}
    .header{display:flex;flex-direction:column;gap:6px;padding:12px;
      border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(15,18,34,.9);
      backdrop-filter:blur(8px);z-index:100}
    .header-row{display:flex;align-items:center;gap:6px}
    .header-row:first-child{justify-content:center}
    .header-row:last-child{justify-content:center}
    .logo{font-size:18px;font-weight:800;white-space:nowrap}
    .logo span{color:var(--primary)}
    .header-right{display:flex;gap:6px;align-items:center}
    #walletAddr{font-size:11px;color:var(--text-muted);font-family:monospace;display:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #walletBalance{font-size:11px;color:var(--success);font-family:monospace;display:none;margin-left:4px}
    button{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);
      color:var(--text);font-size:12px;cursor:pointer;min-height:38px}
    button:hover{border-color:var(--primary)}
    #btnLang{font-weight:700;min-width:46px}
    .header-left{display:flex;align-items:center;gap:6px}
    .main{max-width:560px;margin:0 auto;padding:14px 12px 60px}
    .hero{text-align:center;margin-bottom:14px}
    .hero h1{font-size:17px;margin:0 0 6px}
    .hero p{color:var(--text-muted);font-size:11px;margin:0;line-height:1.6}
    .hero p b{color:var(--warning)}
    .hero a{color:var(--primary)}
    /* 手机尺寸：每行固定 3 个格子 */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .game-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 6px 10px;
      text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;
      gap:4px;text-align:center;transition:transform .15s,border-color .15s}
    .game-card:hover{border-color:var(--primary)}
    .game-card:active{transform:scale(.95)}
    .game-icon{font-size:34px;line-height:1.2}
    .game-name{font-weight:700;font-size:12px;line-height:1.3;min-height:16px}
    .game-desc{display:none}
    .game-price{font-size:10px;color:var(--primary);font-weight:700}
    .foot{margin-top:24px;text-align:center;font-size:11px;color:var(--text-muted);line-height:1.9}
    .toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99999;
      background:#141830;color:var(--text);border:1px solid var(--border);border-radius:10px;
      padding:10px 18px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:92vw}
    .toast.success{border-color:var(--success)}
    .toast.error{border-color:var(--danger);color:#ffc9c9}
    .debug-banner{position:fixed;top:0;left:0;right:0;z-index:99990;background:#7a2b2b;color:#fff;
      text-align:center;font-size:12px;padding:4px}
    @media (max-width:480px){
      .hero h1{font-size:15px}
      .hero p{font-size:10px}
      .main{padding:10px 8px 60px}
      .grid{gap:8px}
      .game-icon{font-size:30px}
      .game-name{font-size:11px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="logo">🎮 PAXI <span>Games</span></div>
    </div>
    <div class="header-row">
      <span id="walletAddr"></span>
      <span id="walletBalance"></span>
      <button id="btnLang">EN</button>
      <button id="btnWallet"></button>
      <button id="btnAdmin" title="Admin">⚙️</button>
      <button id="btnFaucet" title="Faucet">🎁</button>
    </div>
  </div>

  <div class="main">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroRules"></p>
    </div>
    <div class="grid" id="gameGrid"></div>
    <div class="foot" id="foot"></div>
  </div>

  <!-- 大厅渲染：仅依赖 config.js + i18n.js，不依赖链 SDK，CDN 慢也不白屏 -->
  <script src="config.js"></script>
  <script src="common/i18n.js"></script>
  <script>
    const GAMES = [
      // ---- 第一梯队：链游主题（对标 CryptoMafia / CROAK Quest / BlockchainX / Shards / decentralized-game-template）
      { id: 'arrow-puzzle', icon: '➡️', deaths: false },
      { id: 'card-mafia', icon: '🃏', deaths: true },
      { id: 'croak-quest', icon: '🐸', deaths: true },
      { id: 'blockchain-miner', icon: '⛏️', deaths: true },
      { id: 'shards', icon: '💠', deaths: true },
      { id: 'dungeon-runner', icon: '🏃', deaths: true },
      // ---- 第二梯队：经典街机
      { id: 'tetris', icon: '🟦', deaths: true },
      { id: 'plane-war', icon: '✈️', deaths: true },
      { id: 'bubble-shooter', icon: '🫧', deaths: true },
      { id: '2048', icon: '🔢', deaths: true },
      { id: 'klotski', icon: '🧩', deaths: false },
    ];

    function showToast(msg, type = '') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const d = document.createElement('div');
      d.className = 'toast ' + type;
      d.textContent = msg;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 4000);
    }

    (function renderLobbyNow() {
      const c = window.PAXI_CONFIG;
      // 语言按钮
      document.getElementById('btnLang').textContent = window.PAXI_LANG === 'zh' ? 'EN' : '中';
      document.getElementById('btnWallet').textContent = t('shell.connect');
      // hero
      // 双币费用显示（prc20 未启用时只显示 PAXI）
      const p20 = c.prc20, prcOn = p20 && p20.enabled && p20.contract;
      const cost = (paxi, tok) => {
        let s = paxi + ' PAXI';
        if (tok > 0 && prcOn) s += ' + ' + tok.toLocaleString() + ' ' + p20.symbol;
        return s;
      };
      document.getElementById('heroTitle').textContent = t('lobby.heroTitle');
      document.getElementById('heroRules').innerHTML =
        t('lobby.heroAll', {
          e: '<b>' + cost(c.entryFee, prcOn ? p20.entryAmount : 0) + '</b>',
          r: c.entryRounds,
          f: '<b>' + c.freeRevives + '</b>',
          s: '<b>' + cost(c.reviveSingle, prcOn ? p20.reviveSingleAmount : 0) + '</b>',
          d: '<b>' + cost(c.reviveDouble, prcOn ? p20.reviveDoubleAmount : 0) + '</b>'
        });
      // 游戏卡片
      document.getElementById('gameGrid').innerHTML = GAMES.map(g => `
        <a class="game-card" href="games/${g.id}/">
          <div class="game-icon">${g.icon}</div>
          <div class="game-name">${t('game.' + g.id)}</div>
          <div class="game-desc">${t('game.' + g.id + '.d')}${g.deaths ? '' : '<br><span style="font-size:10px">' + t('lobby.noDeath') + '</span>'}</div>
          <div class="game-price">💳 ${c.chargeEnabled ? cost(c.entryFee, prcOn ? p20.entryAmount : 0) + ' / ' + c.entryRounds + t('lobby.rounds') : t('lobby.free')}</div>
        </a>
      `).join('');
      document.getElementById('foot').textContent = t('lobby.foot');

      if (!c.chargeEnabled) {
        const d = document.createElement('div');
        d.className = 'debug-banner';
        d.textContent = t('pay.debugBanner');
        document.body.appendChild(d);
      }

      document.getElementById('btnLang').onclick = () => setLang(window.PAXI_LANG === 'zh' ? 'en' : 'zh');
    })();
  </script>

  <!-- 链 SDK：defer 后台加载，只在连接钱包/支付时才真正用到 -->
  <script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js" defer></script>
  <script src="common/compat.js" defer></script>
  <script src="common/paxi-sdk.js" defer></script>
  <script src="common/admin.js" defer></script>
  <script src="common/faucet.js" defer></script>
  <script>
    // 全局 UI 更新函数：paxi-sdk.js 的 connectWallet/disconnectWallet 会调用它
    // 必须挂在 window 上，否则 SDK 检测 typeof updateWalletUI === 'function' 会失败
    window.updateWalletUI = function () {
      const btn = document.getElementById('btnWallet');
      const addr = document.getElementById('walletAddr');
      const bal = document.getElementById('walletBalance');
      if (!btn) return;
      if (state.connected && state.wallet) {
        btn.textContent = t('shell.disconnect');
        if (addr) {
          addr.textContent = state.wallet.address.slice(0, 10) + '...' + state.wallet.address.slice(-6);
          addr.style.display = 'inline';
        }
        if (bal) {
          if (state.balance !== null && state.balance !== undefined) {
            bal.textContent = Number(state.balance).toFixed(1) + ' ' + PAXI_CFG().displayDenom;
            bal.style.display = 'inline';
          } else {
            bal.style.display = 'none';
          }
        }
      } else {
        btn.textContent = t('shell.connect');
        if (addr) addr.style.display = 'none';
        if (bal) bal.style.display = 'none';
      }
    };

    window.addEventListener('DOMContentLoaded', function () {
      // 如果 SDK 已经先连上（比如 defer 脚本先执行完），立即同步一次 UI
      window.updateWalletUI();
      document.getElementById('btnWallet').onclick = async () => {
        if (state.connected) disconnectWallet();
        else { await connectWallet(); refreshBalance(); }
      };
      document.getElementById('btnAdmin').onclick = () => PaxiAdmin.open();
      document.getElementById('btnFaucet').onclick = () => PaxiFaucet.openClaim();
    });
  </script>
</body>
</html>
